# License: Apache-2.0 (owner decision, 2026-07-07 — decision record 0028).
# Dependency policy: third-party dependencies are PERMITTED when a
# capability genuinely needs one (owner decision, 2026-07-07, DR 0028);
# each addition is declared here and justified in its decision record.
# The package stays private/internal until provenance and promotion gates
# are satisfied.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mecha-engine"
version = "0.0.0"
description = "Engine core for the Mechagotchi grid-based artificial-life engine"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["../../LICENSE"]
dependencies = []
classifiers = [
    "Private :: Do Not Upload",
]

[tool.setuptools.package-data]
mecha_engine = ["py.typed"]
