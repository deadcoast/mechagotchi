# Workspace dependency manifest (decision records 0005 and 0028).
#
# This root [project] is the research workspace itself and carries no
# dependencies. Shipped builds declare their own (packages/mecha_engine,
# tools/mechas_cli, game/) under DR 0028's policy: third-party
# dependencies are permitted when a capability needs one, declared in
# the build's pyproject and justified in the feature's decision record.
#
# The [dependency-groups] below provision interpreter extras for
# in-repo development and test runs. Labs stay stdlib-only by
# convention outside the declared "lab" exceptions. Provision with:
#
#     uv sync --group lab
#
[project]
name = "mechagotchi"
version = "0.0.0"
description = "Research workspace for a grid-based artificial-life companion engine (labs only; no package code)"
requires-python = ">=3.13"

[dependency-groups]
lab = [
    "pydantic>=2.12",
    "jsonschema>=4.26",
]
# The mechas companion CLI (decision record 0007). Runtime home is
# tools/mechas_cli (its own installable package with a `mechas` entry
# point); this group provisions the same dependencies for in-repo
# development and test runs: uv sync --group cli
cli = [
    "typer>=0.15",
    "rich>=13.9",
]
# The playable game client (decision record 0033). Runtime home is
# game/ (its own installable package, product title "Mechagotchi");
# this group provisions the same dependency for in-repo development
# and test runs: uv sync --group game
game = [
    "pygame-ce>=2.5.7",
    # F5 (DR 0033 named it; the F5 report decides it): the installable
    # release builder for the game client.
    "pyinstaller>=6.11",
]
