<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mecha_workshop — Inspector</title>
<style>
  :root {
    --ground: #e8e6dd; --panel: #f2f1ea; --ink: #26291f; --ink-soft: #5c6052;
    --line: #cfcdc0; --accent: #3f8f4a; --accent-ink: #ffffff;
    --bezel: #31352b; --amber: #c98a2b; --danger: #a8442e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #1a1d18; --panel: #22261f; --ink: #dfe3d3; --ink-soft: #9aa08c;
      --line: #383d33; --accent: #5dbb63; --accent-ink: #10240f;
      --bezel: #0d0f0b; --amber: #d9a04a; --danger: #d1705a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: system-ui, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.5; }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  .shell { max-width: 1020px; margin: 0 auto; padding: 24px 20px 60px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  header.top h1 { font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; font-size: 1.1rem; font-weight: 600; margin: 0; }
  header.top h1 .dim { color: var(--ink-soft); font-weight: 400; }
  header.top nav a { font-family: ui-monospace, Consolas, monospace; font-size: 0.8rem; color: var(--ink-soft); text-decoration: none; margin-left: 14px; }
  header.top nav a:hover { color: var(--accent); }
  .pickbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-top: 16px; }
  .pickbar label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
  select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink); font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-top: 14px; }
  .panel h2 { font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 10px; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
  th, td { text-align: left; padding: 4px 10px; border-bottom: 1px solid var(--line); }
  th { font-family: ui-monospace, Consolas, monospace; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); font-weight: 600; }
  td.mono, .chip { font-family: ui-monospace, Consolas, monospace; }
  .scroll { overflow-x: auto; max-height: 300px; overflow-y: auto; }
  .ok-text { color: var(--accent); font-weight: 600; }
  .bad-text { color: var(--danger); font-weight: 600; }
  .chip { font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-soft); margin-right: 4px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.25); vertical-align: baseline; margin-right: 6px; }
  .notice { font-size: 0.82rem; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>mecha_workshop <span class="dim">/ inspector</span>
      <nav style="display:inline"><a href="/">grid editor →</a><a href="/slip">slip creator →</a><a href="/preview">preview →</a></nav>
    </h1>
  </header>

  <div class="pickbar">
    <label for="creature-select">creature</label>
    <select id="creature-select"></select>
    <span class="notice" id="verdict"></span>
  </div>

  <div class="panel">
    <h2>identity &amp; lineage</h2>
    <div id="identity" class="notice">…</div>
  </div>

  <div class="panel">
    <h2>organs</h2>
    <div class="scroll"><table id="organs-table"><thead><tr><th>organ</th><th>role</th><th>cells</th><th>required</th></tr></thead><tbody></tbody></table></div>
  </div>

  <div class="panel">
    <h2>cells — the genome, row by row</h2>
    <div class="scroll"><table id="cells-table"><thead><tr><th>x,y</th><th>role</th><th>organ</th><th>material</th><th>weight</th><th>visual</th><th>anchor</th></tr></thead><tbody></tbody></table></div>
  </div>

  <div class="panel">
    <h2>lineage browser — released creatures &amp; evolution runs</h2>
    <div id="lineage-body" class="notice">…</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

async function inspect() {
  const [source, name] = $("creature-select").value.split("::");
  const payload = await (await fetch(`/api/inspect?source=${source}&name=${name}`)).json();
  if (!payload.ok) return;
  $("verdict").innerHTML = payload.validation.ok
    ? '<span class="ok-text">engine: valid</span>'
    : '<span class="bad-text">engine: ' + payload.validation.errors.length + " problems</span>";
  const lineage = payload.lineage || {};
  const stats = payload.stats || {};
  $("identity").innerHTML =
    `<span class="chip">${payload.grid_id}</span>` +
    `<span class="chip">gen ${lineage.generation ?? 0}</span>` +
    `<span class="chip">${payload.palette?.palette_id || ""}</span>` +
    `<span class="chip">mass ${stats.body_mass}</span>` +
    `<span class="chip">load ${stats.stress_load}</span>` +
    `<br><span class="notice">ancestors: ${(lineage.ancestor_ids || []).join(" → ") || "none (founder)"}</span>` +
    `<br><span class="notice">events: ${(lineage.mutation_events || []).join(", ") || "—"}</span>` +
    `<br><span class="notice">source: ${payload.metadata?.source || "corpus"}</span>`;
  const organsBody = $("organs-table").querySelector("tbody");
  organsBody.innerHTML = "";
  for (const [organId, organ] of Object.entries(payload.organs)) {
    organsBody.insertAdjacentHTML("beforeend",
      `<tr><td class="mono">${organId}</td><td>${organ.role}</td><td>${organ.cell_count}</td><td>${organ.required ? "yes" : ""}</td></tr>`);
  }
  const cellsBody = $("cells-table").querySelector("tbody");
  cellsBody.innerHTML = "";
  for (const cell of payload.cells) {
    cellsBody.insertAdjacentHTML("beforeend",
      `<tr><td class="mono">${cell.x},${cell.y}</td><td>${cell.role}</td><td class="mono">${cell.organ}</td><td>${cell.material}</td><td class="mono">${cell.mutation_weight}</td>` +
      `<td class="mono"><span class="swatch" style="background:${cell.visual}"></span>${cell.visual}</td><td>${cell.animation_anchor ? "★" : ""}</td></tr>`);
  }
}

async function loadLineage() {
  const payload = await (await fetch("/api/lineage")).json();
  let html = "";
  if (payload.released.length) {
    html += "<strong>released into the ecosystem:</strong><br>";
    for (const entry of payload.released) {
      html += `<span class="chip">${entry.grid_id}</span> gen ${entry.lineage?.generation ?? 0} · events: ${(entry.lineage?.mutation_events || []).join(", ")}<br>`;
    }
  } else {
    html += "no creatures released yet — the grid editor's Release button sends them into evolution<br>";
  }
  html += "<br><strong>evolution runs (engine evidence):</strong><br>";
  for (const run of payload.evolution_runs) {
    html += `<span class="chip">${run.lab_id}</span> archive ${run.archive?.filled_niches ?? "?"} niches, QD ${run.archive?.qd_score ?? "?"}`;
    if (run.founder_ids) {
      html += ` — founders ${run.founder_ids.join(", ")}; workshop creatures by generation [${run.creature_count_by_generation.join(", ")}]; lineage survived beyond founding: ${run.lineage_survived_beyond_founding}`;
      html += ` (workshop fitness ${run.mean_fitness} vs corpus ${run.corpus_mean_fitness})`;
    }
    html += "<br>";
  }
  $("lineage-body").innerHTML = html;
}

(async function boot() {
  const creatures = (await (await fetch("/api/preview/creatures")).json()).creatures;
  const released = (await (await fetch("/api/released")).json()).released;
  const select = $("creature-select");
  for (const entry of released) {
    const option = document.createElement("option");
    option.value = "released::" + entry.name;
    option.textContent = entry.name + " · released";
    select.appendChild(option);
  }
  for (const entry of creatures) {
    const option = document.createElement("option");
    option.value = entry.source + "::" + entry.name;
    option.textContent = entry.name + " · " + entry.source;
    select.appendChild(option);
  }
  select.addEventListener("change", inspect);
  inspect();
  loadLineage();
})();
</script>
</body>
</html>
