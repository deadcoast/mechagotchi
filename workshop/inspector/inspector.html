<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mecha_workshop — Inspector</title>
<style>
  :root {
    --ground: #e8e6dd; --panel: #f2f1ea; --ink: #26291f; --ink-soft: #5c6052;
    --line: #cfcdc0; --accent: #3f8f4a; --accent-ink: #ffffff;
    --bezel: #31352b; --amber: #c98a2b; --danger: #a8442e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #1a1d18; --panel: #22261f; --ink: #dfe3d3; --ink-soft: #9aa08c;
      --line: #383d33; --accent: #5dbb63; --accent-ink: #10240f;
      --bezel: #0d0f0b; --amber: #d9a04a; --danger: #d1705a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: system-ui, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.5; }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  .shell { max-width: 1020px; margin: 0 auto; padding: 24px 20px 60px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  header.top h1 { font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; font-size: 1.1rem; font-weight: 600; margin: 0; }
  header.top h1 .dim { color: var(--ink-soft); font-weight: 400; }
  header.top nav a { font-family: ui-monospace, Consolas, monospace; font-size: 0.8rem; color: var(--ink-soft); text-decoration: none; margin-left: 14px; }
  header.top nav a:hover { color: var(--accent); }
  .pickbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-top: 16px; }
  .pickbar label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
  select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--ground); color: var(--ink); font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-top: 14px; }
  .panel h2 { font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 10px; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
  th, td { text-align: left; padding: 4px 10px; border-bottom: 1px solid var(--line); }
  th { font-family: ui-monospace, Consolas, monospace; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); font-weight: 600; }
  td.mono, .chip { font-family: ui-monospace, Consolas, monospace; }
  .scroll { overflow-x: auto; max-height: 300px; overflow-y: auto; }
  .ok-text { color: var(--accent); font-weight: 600; }
  .bad-text { color: var(--danger); font-weight: 600; }
  .chip { font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-soft); margin-right: 4px; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.25); vertical-align: baseline; margin-right: 6px; }
  .notice { font-size: 0.82rem; color: var(--ink-soft); }
</style>
<link rel="stylesheet" href="/shared/authoring.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>mecha_workshop <span class="dim">/ inspector</span>
      <nav style="display:inline"><a href="/">grid editor →</a><a href="/slip">slip creator →</a><a href="/preview">preview →</a><a href="/packs">packs →</a></nav>
    </h1>
  </header>

  <div class="pickbar">
    <label for="creature-select">creature</label>
    <select id="creature-select"></select>
    <span class="notice" id="verdict"></span>
  </div>

  <div class="panel">
    <h2>stored identity &amp; genetic declarations</h2>
    <div id="identity" class="notice">…</div>
  </div>

  <div class="panel">
    <h2>organs</h2>
    <div class="scroll"><table id="organs-table"><thead><tr><th>organ</th><th>role</th><th>cells</th><th>required</th></tr></thead><tbody></tbody></table></div>
  </div>

  <div class="panel">
    <h2>cells — the genome, row by row</h2>
    <div class="scroll"><table id="cells-table"><thead><tr><th>x,y</th><th>role</th><th>organ</th><th>material</th><th>weight</th><th>visual</th><th>anchor</th></tr></thead><tbody></tbody></table></div>
  </div>

  <div class="panel">
    <h2>recorded campaigns &amp; Keeper lives</h2>
    <div id="lineage-body" class="notice">…</div>
  </div>
</div>

<script src="/shared/authoring.js"></script>
<script>
const A=WorkshopAuthoring,$=id=>document.getElementById(id),selectedContext=new A.Context().mount(),gate=new A.RequestGate();
let entries=[],revision=0;
function facts(host,record){const pre=A.element("pre",JSON.stringify(record,null,2),"context-facts");host.append(pre);}
function row(body,values){const tr=A.element("tr");for(const value of values)tr.append(A.element("td",value??"unavailable"));body.append(tr);}
async function inspect(){
  const current=gate.begin("inspect",++revision),entry=entries[Number($("creature-select").value)];if(!entry)return;
  A.notice($("verdict"),"Reading exact saved document…");
  try{const result=await selectedContext.resolve(entry.ref),document=result.document;const validation=await A.request("/api/validate",{document,draft_revision:current.revision});if(!gate.accept(current,revision,validation.draft_revision))return;
    const grid=document.grid;
    let inspection={validation:{ok:validation.valid,errors:validation.errors},stats:validation.stats};
    if(selectedContext.data.kind==="browser_lab"){
      const source=entry.ref.source,name=entry.ref.name||entry.ref.grid_id;
      const legacy=await A.request("/api/inspect?"+new URLSearchParams({source,name}));
      if(!gate.accept(current,revision,current.revision))return;
      if(!A.equal(legacy.cells,grid.cells))throw new Error("The source changed while reading engine details. Select it again.");
      inspection={validation:legacy.validation,stats:legacy.stats};
    }
    A.notice($("verdict"),validation.valid?"engine: valid":"engine: "+validation.errors.length+" issues",validation.valid?"ok":"err");
    $("identity").replaceChildren(A.element("p",`${grid.grid_id} · selected source: ${entry.label||entry.source}`));
    facts($("identity"),{grid_id:grid.grid_id,parent_grid_id:grid.parent_grid_id??null,lineage:grid.lineage??null,metadata:grid.metadata??null,source_provenance:result.provenance??null});
    $("identity").append(A.element("h3","Engine validation and morphology"));facts($("identity"),inspection);
    $("identity").append(A.element("p","These are stored genetic and source declarations. A release or shared Keeper does not establish parentage. Missing ancestry remains unavailable.","notice"));
    const organs=$("organs-table").querySelector("tbody"),cells=$("cells-table").querySelector("tbody");organs.replaceChildren();cells.replaceChildren();
    for(const [id,organ] of Object.entries(grid.organs||{}))row(organs,[id,organ.role,organ.cells?.length??organ.cell_count,organ.required?"yes":"no"]);
    for(const cell of grid.cells)row(cells,[`${cell.x},${cell.y}`,cell.role,cell.organ,cell.material,cell.mutation_weight,cell.visual,cell.animation_anchor?"yes":"no"]);
  }catch(error){if(gate.accept(current,revision,current.revision))A.notice($("verdict"),error.message+". Select again after refreshing the context.","err");}
}
async function loadLineage(){
  const host=$("lineage-body");host.replaceChildren(A.element("p","Reading recorded campaign facts…"));
  try{const result=await A.request("/api/context/lineage");host.replaceChildren();host.append(A.element("p",result.notice||"Stored era reports and actual Keeper lives are separate evidence.","notice"));
    if(!result.available){host.append(A.element("p",result.reason||"Recorded native campaign history is unavailable in this context.","notice"));return;}
    const lives=A.element("section");lives.append(A.element("h3","Actual Keeper lives"));for(const life of result.lives||[]){const details=A.element("details");details.append(A.element("summary",`${life.life_id||"Recorded life"} · ${life.grid_id||life.outcome||"recorded facts"}`));facts(details,life);lives.append(details);}if(!result.lives?.length)lives.append(A.element("p","Prior cared-life records are unavailable."));host.append(lives);
    for(const campaign of result.campaigns||[]){const section=A.element("section");section.append(A.element("h3","Campaign "+campaign.campaign_id),A.element("p",`Predecessor: ${campaign.predecessor_campaign_id||"not recorded"} · ${campaign.status||"stored"}`,"notice"));
      for(const era of campaign.eras||[]){const details=A.element("details");details.append(A.element("summary","Era "+era.era_index+" · recorded founder decisions and elite genomes"));details.append(A.element("h4","Actual engine admission report"));facts(details,era.report?.founders??{unavailable:"This era has no recorded founder admission report."});details.append(A.element("h4","Saved founder coverage"));facts(details,era.founder_provenance??{available:false,reason:"No founder coverage record"});details.append(A.element("h4","Recorded founder documents"));facts(details,era.founder_records||[]);details.append(A.element("h4","Recorded elite genomes and genetic declarations"));facts(details,era.elites||[]);section.append(details);}host.append(section);}
    if(!result.campaigns?.length)host.append(A.element("p","No saved campaign era reports are available."));
  }catch(error){host.replaceChildren(A.element("p",error.message+". Refresh selected context to retry.","notice err"));}
}
async function boot(){try{await selectedContext.refresh();entries=await selectedContext.inventory();$("creature-select").replaceChildren();entries.forEach((entry,index)=>$("creature-select").add(new Option(entry.label||entry.grid_id,String(index))));if(entries.length)await inspect();else A.notice($("verdict"),"No supported saved creatures in this context.");await loadLineage();}catch(error){A.notice($("verdict"),error.message,"err");}}
$("creature-select").addEventListener("change",inspect);let starting=true;selectedContext.onChange=()=>{if(!starting){inspect();loadLineage();}};boot().finally(()=>starting=false);
</script>
</body>
</html>
